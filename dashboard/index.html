
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberFleet 2026 | Security Dashboard</title>
    <style>
        body {
            margin: 0;
            background: #0b1220;
            color: #e2e8f0;
            font-family: Arial, sans-serif;
        }
        header {
            padding: 25px;
            background: #111c30;
            border-bottom: 1px solid #26354d;
        }
        h1 { color: #38bdf8; margin: 0; }
        main { padding: 25px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
            gap: 20px;
        }
        .card {
            background: #17243a;
            padding: 22px;
            border-radius: 10px;
            border: 1px solid #26354d;
        }
        .status { color: #4ade80; font-weight: bold; }
        .number { font-size: 28px; color: #38bdf8; }
    </style>
</head>
<body>
<header>
    <h1>CyberFleet 2026</h1>
    <p>Infrastructure & Security Monitoring</p>
</header>
<main>
    <h2>Fleet Overview</h2>
    <div class="grid">
        <div class="card">
            <h3>Infrastructure</h3>
            <p class="number">8</p>
            <p>Virtual systems</p>
            <p class="status">Docker containers running</p>
        </div>
        <div class="card">
            <h3>Network Zones</h3>
            <p class="number">3</p>
            <p>MGMT / CORP / DMZ-IOT</p>
        </div>
        <div class="card">
            <h3>Security</h3>
            <p class="status">Monitoring pending</p>
            <p>Osquery integration planned</p>
        </div>
        <div class="card">
            <h3>Backup</h3>
            <p class="status">Configuration pending</p>
            <p>Backup Vault</p>
        </div>
    </div>
</main>
</body>
</html>
